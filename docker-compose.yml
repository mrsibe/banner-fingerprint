services:
  server:
    build:
      context: .
      target: server
    ports:
      - "127.0.0.1:8080:8080"
    networks: [ingress, fingerprint]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
  client:
    build:
      context: .
      target: client
    networks: [fingerprint]
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  ingress:
    driver: bridge
  fingerprint:
    internal: true
